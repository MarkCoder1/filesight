appId: com.filesight.app
productName: FileSight
copyright: Copyright © 2026 FileSight

directories:
  output: dist
  buildResources: resources

files:
  - electron-dist/**/*
  - out/**/*
  - package.json

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: FileSight-${version}-mac-${arch}.${ext}
  icon: assets/icons/filesight.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  identity: null
  extendInfo:
    CFBundleName: FileSight
    CFBundleDisplayName: FileSight
    CFBundleExecutable: FileSight
    CFBundlePackageType: APPL
    CFBundleSignature: FSGT
    NSHighResolutionCapable: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: FileSight-${version}-win-x64.${ext}
  icon: assets/icons/filesight.ico

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  artifactName: FileSight-${version}-linux-x64.${ext}
  category: Utility
  icon: assets/icons/filesight.png
  desktop:
    Name: FileSight
    Comment: Understand your files. Reclaim your space.
    Categories: Utility;

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FileSight
  artifactName: FileSight-${version}-win-x64-Setup.${ext}

dmg:
  title: FileSight
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: anomalyco
  repo: filesight
