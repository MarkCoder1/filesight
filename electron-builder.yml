appId: com.filesight.app
productName: FileSight
copyright: Copyright © 2026 FileSight
compression: maximum

directories:
  output: dist
  buildResources: resources

files:
  - electron-dist/**/*
  - '!electron-dist/**/*.js.map'
  - out/**/*
  - package.json

asarUnpack:
  - out/**/*

afterPack: ./scripts/remove-locales.cjs

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: FileSight-${version}-arm64.${ext}
  icon: assets/icons/filesight.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  identity: null
  extendInfo:
    CFBundleName: FileSight
    CFBundleDisplayName: FileSight
    CFBundleExecutable: FileSight
    CFBundlePackageType: APPL
    CFBundleSignature: FSGT
    NSHighResolutionCapable: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: FileSight-${version}-win-x64.${ext}
  icon: assets/icons/filesight.ico

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: assets/icons/filesight.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FileSight
  artifactName: FileSight-${version}-win-x64-Setup.${ext}

dmg:
  title: FileSight
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: anomalyco
  repo: filesight
